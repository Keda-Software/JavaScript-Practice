<!DOCTYPE html>
<html lang="en">
<body>
  <h1>Simple Calculator</h1>
  <input id="firstNumber" type="number" placeholder="First number">
  <input id="secondNumber" type="number" placeholder="Second number">
  <button data-op="+">Add</button>
  <button data-op="-">Subtract</button>
  <button data-op="*">Multiply</button>
  <button data-op="/">Divide</button>
  <p id="result">Result will appear here</p>
  <script src="19-calculator.js"></script>
</body>
</html>
